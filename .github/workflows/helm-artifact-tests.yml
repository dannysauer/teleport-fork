name: Helm artifact tests

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  IMAGE_NAME: teleport
  KUBECONFORM_VERSION: v0.7.0

jobs:
  published-artifacts:
    name: Published image and Helm charts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.image.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Install registry tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to ghcr.io
        run: |
          echo "${{ github.token }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Inspect published image
        id: image
        run: |
          IMAGE="ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:latest"
          INFO="$(skopeo inspect "docker://${IMAGE}")"
          VERSION="$(jq -r '.Labels["org.opencontainers.image.version"] // empty' <<<"${INFO}")"

          if [ -z "${VERSION}" ]; then
            echo "Image is missing org.opencontainers.image.version" >&2
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
            echo "Image version is not a release version: ${VERSION}" >&2
            exit 1
          fi

          MANIFEST="$(docker manifest inspect "${IMAGE}")"
          jq -e '
            .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
            and ([.manifests[].platform.architecture] | sort == ["amd64", "arm64"])
          ' <<<"${MANIFEST}"

          CONFIG="$(skopeo inspect --config "docker://${IMAGE}")"
          jq -e '.config.Entrypoint == ["/usr/bin/teleport", "start"]' <<<"${CONFIG}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Run image smoke test
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          docker run --rm --entrypoint /usr/bin/teleport "${IMAGE}" version | tee /tmp/teleport-version.txt
          grep -F "Teleport v${VERSION}" /tmp/teleport-version.txt

      - name: Pull published charts
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          mkdir -p chart-artifacts
          cd chart-artifacts

          for chart in \
            teleport-cluster \
            teleport-kube-agent \
            tbot \
            teleport-relay \
            teleport-plugin-event-handler; do
            helm pull "oci://ghcr.io/${GHCR_OWNER}/charts/${chart}" --version "${VERSION}"
          done

      - name: Render Teleport charts
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          helm template teleport-test \
            "oci://ghcr.io/${GHCR_OWNER}/charts/teleport-cluster" \
            --version "${VERSION}" \
            --namespace teleport-test \
            --hide-notes \
            --set clusterName=teleport-test.local \
            --set proxyListenerMode=multiplex \
            > teleport-cluster-rendered.yaml

          helm template teleport-agent-test \
            "oci://ghcr.io/${GHCR_OWNER}/charts/teleport-kube-agent" \
            --version "${VERSION}" \
            --namespace teleport-agent-test \
            --hide-notes \
            --set proxyAddr=teleport-test.local:443 \
            --set authToken=test-token \
            --set kubeClusterName=kind-smoke \
            > teleport-kube-agent-rendered.yaml

          grep -F "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${VERSION}" \
            teleport-cluster-rendered.yaml
          grep -F "ghcr.io/${GHCR_OWNER}/${IMAGE_NAME}:${VERSION}" \
            teleport-kube-agent-rendered.yaml

          if grep -F "public.ecr.aws/gravitational/teleport-distroless" \
            teleport-cluster-rendered.yaml teleport-kube-agent-rendered.yaml; then
            echo "Rendered manifests still reference upstream Teleport distroless images" >&2
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered manifests
        run: |
          for manifest in teleport-cluster-rendered.yaml teleport-kube-agent-rendered.yaml; do
            awk '
              function flush() {
                if (has_api && has_kind) {
                  printf "%s", doc
                }
                doc = ""
                has_api = 0
                has_kind = 0
              }
              /^---[[:space:]]*$/ {
                flush()
                doc = $0 "\n"
                next
              }
              {
                doc = doc $0 "\n"
                if ($0 ~ /^apiVersion:[[:space:]]*/) {
                  has_api = 1
                }
                if ($0 ~ /^kind:[[:space:]]*/) {
                  has_kind = 1
                }
              }
              END {
                flush()
              }
            ' "${manifest}" > "${manifest%.yaml}-resources.yaml"
          done

          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            teleport-cluster-rendered-resources.yaml \
            teleport-kube-agent-rendered-resources.yaml

  kind-install:
    name: Kind install smoke
    needs: published-artifacts
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.published-artifacts.outputs.version }}
      IMAGE: ${{ needs.published-artifacts.outputs.image }}
      NAMESPACE: teleport-e2e
      RELEASE: teleport-test
    steps:
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: teleport-chart

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to ghcr.io
        run: |
          echo "${{ github.token }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Load published image into kind
        run: |
          docker pull "${IMAGE}"
          kind load docker-image "${IMAGE}" --name teleport-chart

      - name: Install Teleport cluster chart
        run: |
          helm install "${RELEASE}" \
            "oci://ghcr.io/${GHCR_OWNER}/charts/teleport-cluster" \
            --version "${VERSION}" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --wait \
            --timeout 8m \
            --set clusterName=teleport.localhost \
            --set kubeClusterName=kind-e2e \
            --set proxyListenerMode=multiplex \
            --set service.type=ClusterIP \
            --set persistence.enabled=false \
            --set podSecurityPolicy.enabled=false \
            --set teleport-operator.enabled=false \
            --set teleport-operator.installCRDs=never

      - name: Verify rollouts
        run: |
          kubectl get all -n "${NAMESPACE}"
          kubectl rollout status "deployment/${RELEASE}-auth" -n "${NAMESPACE}" --timeout=180s
          kubectl rollout status "deployment/${RELEASE}-proxy" -n "${NAMESPACE}" --timeout=180s

      - name: Verify proxy ping endpoint
        run: |
          kubectl port-forward "svc/${RELEASE}" 3080:443 -n "${NAMESPACE}" \
            >/tmp/teleport-port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill ${PORT_FORWARD_PID}' EXIT

          for _ in $(seq 1 60); do
            if curl -ksSf https://127.0.0.1:3080/webapi/ping >/tmp/teleport-ping.json; then
              cat /tmp/teleport-ping.json
              exit 0
            fi
            sleep 2
          done

          echo "Teleport proxy ping endpoint did not become ready" >&2
          cat /tmp/teleport-port-forward.log >&2
          exit 1

      - name: Show diagnostics on failure
        if: failure()
        run: |
          kubectl get all -n "${NAMESPACE}" || true
          kubectl describe pods -n "${NAMESPACE}" || true
          kubectl logs -n "${NAMESPACE}" -l "app.kubernetes.io/instance=${RELEASE}" --all-containers --tail=200 || true
